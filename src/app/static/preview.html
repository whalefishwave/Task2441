 B9 NPS、B1–B8 满意度做驱动分析。", "scale": "", "sub_items": [], "note": ""}, {"qid": "F2", "section": "F", "section_title": "续约意向与主要影响因素", "title": "影响贵企业续约的主要因素有哪些？（最多选 3 项）", "qtype": "多选题", "options": ["区位与通勤", "空间费用", "硬件设施", "前台与物业服务", "会员经理服务", "社群与资源对接", "活动内容", "其他"], "required": true, "jump": "无条件进入下一题", "analysis": "各因素影响率；对“可能不续约/肯定不续约”样本单独统计，定位流失主因。", "scale": "", "sub_items": [], "note": ""}]}, {"code": "G", "title": "开放题", "questions": [{"qid": "G1", "section": "G", "section_title": "开放题", "title": "您最希望空间在哪些方面改进？（开放题）", "qtype": "多行填空题", "options": [], "required": false, "jump": "无条件进入下一题", "analysis": "文本编码归类（设施/服务/社群/数字化/价格/其他），统计主题频次并摘录代表性原话。", "scale": "", "sub_items": [], "note": "选填；不提示填写任何联系方式。"}, {"qid": "G2", "section": "G", "section_title": "开放题", "title": "其他建议或期望？（开放题）", "qtype": "多行填空题", "options": [], "required": false, "jump": "无条件进入下一题", "analysis": "文本编码归类，作为满意度分项与 NPS 的定性补充解释。", "scale": "", "sub_items": [], "note": "选填；不提示填写任何联系方式。"}]}, {"code": "H", "title": "回访意愿（可选）", "questions": [{"qid": "H1", "section": "H", "section_title": "回访意愿（可选）", "title": "是否愿意接受会员经理的线下回访？", "qtype": "单选题", "options": ["愿意", "不愿意"], "required": false, "jump": "选择“愿意” → 由会员经理按既有会员档案线下联系（问卷不收集联系方式）；选择“不愿意” → 结束。", "analysis": "统计愿意回访占比；仅用于确定线下联系名单规模，问卷本身不收集任何联系方式。", "scale": "", "sub_items": [], "note": "可选回答；本问卷不收集姓名、电话、邮箱、微信等任何联系方式。"}]}], "question_count": 28}</script>
<script>
const DATA = JSON.parse(document.getElementById('questionnaire-data').textContent);
const sectionsEl = document.getElementById('sections');
const timerEl = document.getElementById('timer');
const resultEl = document.getElementById('result-panel');
const resultText = document.getElementById('result-text');
let startTime = null;
let timerHandle = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function optionInput(q, value, type) {
  return `<label><input type="${type}" name="${esc(q.qid)}" value="${esc(value)}"> ${esc(value)}</label>`;
}

function renderQuestion(q) {
  let body = '';
  if (q.qtype === '单选题' || q.qtype === '量表题' || q.qtype === 'NPS 评分题') {
    body = `<div class="options">${q.options.map(o => optionInput(q, o, 'radio')).join('')}</div>`;
  } else if (q.qtype === '多选题') {
    body = `<div class="options">${q.options.map(o => optionInput(q, o, 'checkbox')).join('')}</div>`;
  } else if (q.qtype === '矩阵量表题') {
    const scale = ['1','2','3','4','5'];
    body = q.sub_items.map(item => `
      <div class="matrix-row">
        <span class="label">${esc(item)}</span>
        <div class="scale-group">${scale.map(s => `<label><input type="radio" name="${esc(q.qid)}__${esc(item)}" value="${s}"> ${s}</label>`).join('')}</div>
      </div>`).join('') + `<div class="dim" style="margin-top:6px">${q.options.map(esc).join('；')}</div>`;
  } else {
    body = `<textarea name="${esc(q.qid)}" data-qid="${esc(q.qid)}"></textarea>`;
  }

  const meta = `
    <div class="meta">
      <div><b>题型：</b>${esc(q.qtype)}　<b>量表：</b>${esc(q.scale || '—')}　<b>必填：</b>${q.required ? '是' : '否'}</div>
      <div><b>跳转逻辑：</b>${esc(q.jump)}</div>
      <div><b>分析方式：</b>${esc(q.analysis)}</div>
    </div>`;

  const hidden = (q.qid === 'C3' || q.qid === 'E2') ? ' style="display:none"' : '';
  return `<div class="q" data-qid="${esc(q.qid)}"${hidden}>
    <div class="q-title"><span class="qid">${esc(q.qid)}</span>${esc(q.title)}<span class="req">${q.required ? ' *' : ''}</span></div>
    ${body}${meta}
  </div>`;
}

sectionsEl.innerHTML = DATA.sections.map(sec => `
  <div class="section" data-section="${esc(sec.code)}">
    <h2>${esc(sec.code)} · ${esc(sec.title)}（${sec.questions.length} 题）</h2>
    ${sec.questions.map(renderQuestion).join('')}
  </div>`).join('');
document.getElementById('badge-count').textContent = `题目数 ${DATA.question_count}`;

function applyJump() {
  const c2 = document.querySelector('input[name="C2"]:checked');
  const c3 = document.querySelector('.q[data-qid="C3"]');
  if (c3) c3.style.display = (c2 && c2.value === '是') ? '' : 'none';
  const e1 = document.querySelector('input[name="E1"]:checked');
  const e2 = document.querySelector('.q[data-qid="E2"]');
  if (e2) e2.style.display = (e1 && (e1.value === '经常使用' || e1.value === '偶尔使用')) ? '' : 'none';
}
sectionsEl.addEventListener('change', applyJump);
applyJump();

function tick() {
  if (!startTime) return;
  const sec = (Date.now() - startTime) / 1000;
  timerEl.textContent = `${String(Math.floor(sec / 60)).padStart(2,'0')}:${String(Math.floor(sec % 60)).padStart(2,'0')}`;
}
document.getElementById('start-btn').addEventListener('click', () => {
  startTime = Date.now();
  timerHandle = setInterval(tick, 250);
  timerEl.textContent = '00:00';
  document.getElementById('start-btn').textContent = '计时中…';
});
document.getElementById('meta-btn').addEventListener('click', () => document.body.classList.toggle('show-meta'));
document.getElementById('meta-checkbox').addEventListener('change', e => {
  document.body.classList.toggle('show-meta', e.target.checked);
});
document.getElementById('submit-btn').addEventListener('click', () => {
  if (!startTime) { resultText.textContent = '请先点击“开始试填（启动计时）”。'; resultEl.classList.add('show'); return; }
  clearInterval(timerHandle);
  const elapsedMs = Date.now() - startTime;
  const answered = sectionsEl.querySelectorAll('input:checked, textarea').length;
  resultText.textContent = `作答控件数 ${answered}，实测用时 ${(elapsedMs/1000).toFixed(1)} 秒（${(elapsedMs/60000).toFixed(2)} 分钟），限额 480 秒。`;
  resultEl.classList.add('show');
  resultEl.dataset.elapsedMs = String(elapsedMs);
  resultEl.dataset.answered = String(answered);
  timerEl.textContent = '已提交';
});
</script>
</body>
</html>
